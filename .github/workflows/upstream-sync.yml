name: Sync upstream page-agent

on:
  schedule:
    # 每周一 00:00 UTC 检查上游版本
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check upstream version
        id: check
        run: |
          CURRENT=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/page-agent/package.json','utf8')).version")
          LATEST=$(npm view page-agent version)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "uptodate=true" >> "$GITHUB_OUTPUT"
            echo "page-agent is up to date ($CURRENT), nothing to do."
          else
            echo "Update available: $CURRENT -> $LATEST"
          fi

      - name: Update dependency, bump version, test, build
        if: steps.check.outputs.uptodate != 'true'
        run: |
          npm install page-agent@latest
          npm version patch --no-git-tag-version
          npm run typecheck
          npm test
          npm run build

      - name: Commit built userscript
        if: steps.check.outputs.uptodate != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json dist/
          git commit -m "chore: sync page-agent ${{ steps.check.outputs.current }} -> ${{ steps.check.outputs.latest }} [skip ci]"
          git push
